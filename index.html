<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dad vs Argus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="settings">
    <div id="settings-inner">
      <div class="section-label">Physics</div>
      <div class="setting">
        <label title="Initial upward velocity when jumping — higher = bigger jumps">Jump Height</label>
        <input type="range" id="jumpSlider" min="1" max="15" value="8" step="0.5">
        <span class="val" id="jumpVal">8</span>
      </div>
      <div class="setting">
        <label title="How quickly characters fall — higher = faster descent">Gravity</label>
        <input type="range" id="gravSlider" min="0.02" max="0.20" value="0.10" step="0.01">
        <span class="val" id="gravVal">0.10</span>
      </div>
      <div class="setting">
        <label title="How quickly characters slow to a stop on the ground (0.98 = very slippery, 0.6 = sticky)">Ground Friction</label>
        <input type="range" id="fricSlider" min="0.60" max="0.98" value="0.82" step="0.01">
        <span class="val" id="fricVal">0.82</span>
      </div>
      <div class="setting">
        <label title="How quickly characters slow to a stop in mid-air (higher = more air control)">Air Friction</label>
        <input type="range" id="airFricSlider" min="0.05" max="0.98" value="0.88" step="0.01">
        <span class="val" id="airFricVal">0.88</span>
      </div>

      <div class="section-label">Characters</div>
      <div class="setting">
        <label title="Dad's movement speed — he's bigger and slower">Dad Speed</label>
        <input type="range" id="dadSpeedSlider" min="0.5" max="6.0" value="2.0" step="0.1">
        <span class="val" id="dadSpeedVal">2.0</span>
      </div>
      <div class="setting">
        <label title="Argus's movement speed — he's smaller and faster">Argus Speed</label>
        <input type="range" id="argusSpeedSlider" min="0.5" max="8.0" value="4.0" step="0.1">
        <span class="val" id="argusSpeedVal">4.0</span>
      </div>
      <div class="setting">
        <label title="Damage Dad deals per successful fart hit">Dad Damage</label>
        <input type="range" id="dadDmgSlider" min="1" max="50" value="15" step="1">
        <span class="val" id="dadDmgVal">15</span>
      </div>
      <div class="setting">
        <label title="Damage Argus deals per successful fart hit">Argus Damage</label>
        <input type="range" id="argusDmgSlider" min="1" max="50" value="10" step="1">
        <span class="val" id="argusDmgVal">10</span>
      </div>

      <div class="section-label">Charge Attacks</div>
      <div class="setting">
        <label title="Enable charged fart attacks — hold Space (Dad) or Shift (Argus) to build charge">Charged Farts</label>
        <label class="toggle-label">
          <input type="checkbox" id="chargeToggle" checked>
          <span>Enabled</span>
        </label>
      </div>
      <div class="setting">
        <label title="How fast the charge bar fills while holding the charge key">Charge Speed</label>
        <input type="range" id="chargeRateSlider" min="0.5" max="5" value="1.5" step="0.1">
        <span class="val" id="chargeRateVal">1.5</span>
      </div>
      <div class="setting">
        <label title="Distance (pixels) beyond which a charged fart does nothing">Max Range (px)</label>
        <input type="range" id="chargeRangeSlider" min="50" max="500" value="150" step="10">
        <span class="val" id="chargeRangeVal">150</span>
      </div>
      <div class="setting">
        <label title="Damage multiplier at point-blank. Falls off linearly to 1× at max range.">Point-blank Bonus (×)</label>
        <input type="range" id="chargeMaxMultSlider" min="1" max="5" value="3" step="0.5">
        <span class="val" id="chargeMaxMultVal">3</span>
      </div>
      <div class="setting">
        <label title="Fraction of normal speed while holding the charge key (0.1 = very slow, 0.5 = half speed)">Speed While Charging</label>
        <input type="range" id="chargeMoveSpeedSlider" min="0.1" max="0.5" value="0.3" step="0.05">
        <span class="val" id="chargeMoveSpeedVal">0.30</span>
      </div>

      <div class="close-hint">Press ESC to close</div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
